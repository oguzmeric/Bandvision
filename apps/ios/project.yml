name: BantSayac
options:
  bundleIdPrefix: com.oguzmeric
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  BantSayac:
    type: application
    platform: iOS
    sources: [BantSayac]
    info:
      path: BantSayac/Info.plist
      properties:
        CFBundleDisplayName: Bant Sayaç
        NSCameraUsageDescription: Banttan geçen ürünleri saymak için kamera kullanılır.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzmeric.bantsayac
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
