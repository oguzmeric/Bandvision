name: BantSayac
options:
  bundleIdPrefix: com.oguzmeric
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # CI'da her TestFlight yüklemesinde github.run_number ile ezilir
    CURRENT_PROJECT_VERSION: "1"
targets:
  BantSayac:
    type: application
    platform: iOS
    sources: [BantSayac]
    info:
      path: BantSayac/Info.plist
      properties:
        CFBundleDisplayName: BandVision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Banttan geçen ürünleri saymak için kamera kullanılır.
        NSLocalNetworkUsageDescription: Ağdaki IP kameranın ya da kayıt cihazının görüntüsünü almak için yerel ağa bağlanılır.
        # Kayıt cihazlarının web API'si (Hikvision/Dahua) yerel ağda çoğunlukla düz HTTP; yalnızca yerel ağ serbest
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Açılış ekranı: logo, logonun zemin rengiyle (yapay bekletme yok; uygulama hazır olunca kapanır)
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        # Yalnızca standart HTTPS kullanılıyor; TestFlight'ta ihracat uyumluluk sorusunu atlar
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzmeric.bantsayac
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [BantSayacTests, BantSayacUITests]
  BantSayacTests:
    # Birim testleri: kayıt cihazı yanıt ayrıştırıcıları, ayarların eski kayıtlarla uyumu
    type: bundle.unit-test
    platform: iOS
    sources: [BantSayacTests]
    dependencies:
      - target: BantSayac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzmeric.bantsayac.tests
        TARGETED_DEVICE_FAMILY: "1"
  BantSayacUITests:
    # Uçtan uca test: simülatörde sayısı bilinen klibi sayar (tools/make_ui_test_clip.py)
    type: bundle.ui-testing
    platform: iOS
    sources: [BantSayacUITests]
    dependencies:
      - target: BantSayac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzmeric.bantsayac.uitests
        TEST_TARGET_NAME: BantSayac
        TARGETED_DEVICE_FAMILY: "1"
