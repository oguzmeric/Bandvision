[project]
name = "bantvision-edge"
version = "0.1.0"
description = "BantVision edge servisi: RTSP/USB kameralardan sayım ve kalite kontrol"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27", "pyyaml>=6", "zeroconf>=0.132", "wsdiscovery>=2.0", "onvif-zeep>=0.2.12", "zxing-cpp>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.22"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bantvision*"]

[tool.ruff]
line-length = 110
