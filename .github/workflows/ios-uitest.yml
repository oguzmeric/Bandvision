name: ios-uitest
# Simülatörde uçtan uca test. Elle (Actions → ios-uitest → Run workflow) ya da TestFlight yüklemesinden önce çalışır.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  uitest:
    runs-on: macos-15
    timeout-minutes: 45
    defaults: { run: { working-directory: apps/ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç
        working-directory: .
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::Bu sunucuda Xcode 26 yok"; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Simülatör seç (en yeni iOS, ilk iPhone)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devs if ".iOS-" in k), reverse=True):
              phones = [d for d in devs[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          [ -n "$UDID" ] || { echo "::error::uygun iPhone simülatörü yok"; exit 1; }
          xcrun simctl list devices available | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: RTSP test sunucusu (IP kamera yerine MediaMTX + ffmpeg, Digest kimlik doğrulama)
        working-directory: .
        run: |
          set -e
          curl -sSL -o "$RUNNER_TEMP/mtx.tgz" \
            https://github.com/bluenviron/mediamtx/releases/download/v1.21.1/mediamtx_v1.21.1_darwin_arm64.tar.gz
          mkdir -p "$RUNNER_TEMP/mtx" && tar -xzf "$RUNNER_TEMP/mtx.tgz" -C "$RUNNER_TEMP/mtx"
          python3 -m venv "$RUNNER_TEMP/ff"
          "$RUNNER_TEMP/ff/bin/pip" install -q imageio-ffmpeg
          FF=$("$RUNNER_TEMP/ff/bin/python" -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          CLIP="$GITHUB_WORKSPACE/apps/ios/BantSayacUITests/ui_test_clip.mp4"
          # Okuyucu bağlanınca klip bir kez, gerçek zamanlı, B-karesiz H.264 olarak yayınlanır (IP kamera gibi)
          cat > "$RUNNER_TEMP/mtx/mediamtx.yml" <<EOF
          logLevel: info
          authMethod: internal
          authInternalUsers:
            - user: any
              pass:
              ips: ['127.0.0.1', '::1']
              permissions:
                - action: publish
            - user: test
              pass: test123
              ips: []
              permissions:
                - action: read
          rtspTransports: [tcp]
          rtspAuthMethods: [digest]
          rtmp: false
          hls: false
          webrtc: false
          srt: false
          paths:
            clip:
              runOnDemand: $FF -re -i $CLIP -an -c:v libx264 -preset ultrafast -tune zerolatency -bf 0 -g 30 -pix_fmt yuv420p -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/clip
              runOnDemandRestart: false
          EOF
          (cd "$RUNNER_TEMP/mtx" && nohup ./mediamtx mediamtx.yml > "$RUNNER_TEMP/mediamtx.log" 2>&1 &)
          for i in $(seq 1 40); do nc -z 127.0.0.1 8554 && break; sleep 0.5; done
          nc -z 127.0.0.1 8554 || { echo "::error::MediaMTX başlamadı"; cat "$RUNNER_TEMP/mediamtx.log"; exit 1; }
          # Teşhis: sunucunun kimlik doğrulama önerileri ve ffmpeg ile aynı şifreyle okuma (sunucu tarafını doğrular)
          printf 'DESCRIBE rtsp://127.0.0.1:8554/clip RTSP/1.0\r\nCSeq: 1\r\nAccept: application/sdp\r\n\r\n' \
            | nc -w 3 127.0.0.1 8554 | grep -i -E "RTSP/1.0|WWW-Authenticate" || true
          if "$FF" -v error -rtsp_transport tcp -i rtsp://test:test123@127.0.0.1:8554/clip -t 2 -f null -; then
            echo "ffmpeg Digest okuma: TAMAM"
          else
            echo "::warning::ffmpeg Digest okuma başarısız (sunucu yapılandırması)"
          fi
          sleep 12   # isteğe bağlı yayıncı kapansın; test klibi baştan başlasın (runOnDemandCloseAfter 10 sn)
          # TEST_RUNNER_ önekli değişkenler test sürecine öneksiz geçer
          echo "TEST_RUNNER_BS_RTSP_URL=rtsp://127.0.0.1:8554/clip" >> "$GITHUB_ENV"
          echo "TEST_RUNNER_BS_RTSP_USER=test" >> "$GITHUB_ENV"
          echo "TEST_RUNNER_BS_RTSP_PASS=test123" >> "$GITHUB_ENV"
      - name: UI testi (video uçtan uca + ekranlar)
        run: |
          set +e   # hata olsa da günlüğü göster, sonra xcodebuild'in çıkış koduyla bitir
          # Release: TestFlight'taki gibi optimizasyonlu (Debug'da piksel döngüleri 10-100 kat yavaş).
          # UITEST: test kancalarını açar; TestFlight arşivinde bu bayrak yoktur.
          xcodebuild test -project BantSayac.xcodeproj -scheme BantSayac -configuration Release \
            -destination "id=$UDID" -resultBundlePath "$RUNNER_TEMP/uitest.xcresult" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=UITEST \
            CODE_SIGNING_ALLOWED=NO > uitest.log 2>&1
          status=$?
          grep -E "Test Case|error:|XCTAssert|failed|\*\* TEST|ÖLÇÜM|AĞ DURUMU|TEST KANCASI" uitest.log | tail -40
          # Test başarısız olunca yazdırdığı ekran ağacı (teşhis)
          sed -n '/=== EKRAN/,/=== SON/p' uitest.log | head -300
          exit $status
      - name: Test sonuç paketini sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-result
          path: |
            ${{ runner.temp }}/uitest.xcresult
            ${{ runner.temp }}/mediamtx.log
            apps/ios/uitest.log
      - name: RTSP sunucu günlüğü (son satırlar)
        if: always()
        working-directory: .
        run: tail -40 "$RUNNER_TEMP/mediamtx.log" 2>/dev/null || true
