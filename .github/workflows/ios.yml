name: ios
on:
  push:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    # F0.1: imzasız derleme. Sadece "derleniyor mu?" kontrolü; TestFlight ayrı iş olacak.
    runs-on: macos-15
    timeout-minutes: 30
    defaults: { run: { working-directory: apps/ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç (App Store yüklemesi iOS 26 SDK istiyor)
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$x" ] || x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::Bu sunucuda Xcode 26 yok; runs-on etiketini güncelle"; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (Release, iphoneos, imzasız)
        run: |
          xcodebuild -project BantSayac.xcodeproj -target BantSayac \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet
      - name: Concurrency denetimi (SWIFT_STRICT_CONCURRENCY=complete, uyarılar)
        run: |
          xcodebuild -project BantSayac.xcodeproj -target BantSayac \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO SWIFT_STRICT_CONCURRENCY=complete \
            SYMROOT=build-strict \
            build -quiet 2>&1 | tee strict.log
          n=$(grep -c 'warning:' strict.log || true)
          echo "concurrency uyarısı: $n"
          # Swift 6'ya geçişte hata olacak uyarıların geri gelmesini engelle
          test "$n" -eq 0
