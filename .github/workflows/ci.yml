name: ci
on: [push, pull_request]
jobs:
  edge-core:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,analyzer]"
      - run: ruff check . ../../tools
      - run: pytest -q
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # format-nongpl: uuid ve date-time formatlarının gerçekten denetlenmesi için gerekli
      - run: pip install "jsonschema[format-nongpl]>=4.22" pytest
      - run: python tools/validate_contracts.py
      - run: pytest -q tools/tests
