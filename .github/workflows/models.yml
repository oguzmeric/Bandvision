name: models
# MoveNet Thunder ONNX çevirisi (tools/convert_movenet.py): TensorFlow yalnızca burada çalışır, yerel makinede değil.
# Eşdeğerlik doğrulaması (en büyük fark < 0,01) tutarsa model GitHub sürümü `models-v1`e yüklenir (core/pose_model.py'deki
# MODEL_SHA256 buradaki SHA-256 ile aynı olmalı). Sürümde zaten başka SHA'lı dosya varsa üzerine yazılmaz: yalnızca elle
# (workflow_dispatch, force=true) değiştirilir; böylece depodaki sabit ile sürüm dosyası sessizce ayrışmaz.
on:
  push:
    paths:
      - tools/convert_movenet.py
      - .github/workflows/models.yml
  workflow_dispatch:
    inputs:
      force:
        description: "Sürümdeki movenet_thunder.onnx farklıysa üzerine yaz"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: models-v1
  cancel-in-progress: false
jobs:
  movenet:
    runs-on: ubuntu-24.04
    env:
      REPO: oguzmeric/Bandvision
      TAG: models-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "tensorflow==2.15.*" "numpy<2" kagglehub tf2onnx "onnx<1.17" onnxruntime opencv-python-headless
      - name: Çevir ve doğrula
        run: set -o pipefail; python tools/convert_movenet.py --out movenet_thunder.onnx | tee convert.log
      - name: SHA-256
        run: |
          sha=$(sha256sum movenet_thunder.onnx | cut -d' ' -f1)
          echo "SHA-256: $sha"
          { echo "### movenet_thunder.onnx"; echo; echo "SHA-256: \`$sha\`"; echo; echo '```'; cat convert.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: movenet_thunder.onnx
          path: |
            movenet_thunder.onnx
            convert.log
      - name: GitHub sürümüne yükle
        env:
          FORCE: ${{ inputs.force }}
        run: |
          curl -fsSL https://www.apache.org/licenses/LICENSE-2.0.txt -o LICENSE-APACHE-2.0.txt
          new=$(sha256sum movenet_thunder.onnx | cut -d' ' -f1)
          files=(LICENSE-APACHE-2.0.txt tools/models/MOVENET-NOTICE.md)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            have=""
            if curl -fsSL -o have.onnx "https://github.com/$REPO/releases/download/$TAG/movenet_thunder.onnx"; then
              have=$(sha256sum have.onnx | cut -d' ' -f1)
            fi
            echo "sürümdeki SHA-256: ${have:-yok}; yeni: $new"
            if [ "$have" = "$new" ]; then
              echo "model aynı; yalnızca lisans ve not dosyaları güncellenir"
            elif [ -z "$have" ] || [ "$FORCE" = "true" ]; then
              files+=(movenet_thunder.onnx)
            else
              echo "::warning::sürümdeki model farklı; üzerine yazılmadı (workflow_dispatch, force=true ile yazılır)"
            fi
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" movenet_thunder.onnx "${files[@]}" --repo "$REPO" --title "Modeller v1" \
              --notes "MoveNet SinglePose Thunder (Google, Apache-2.0) ONNX çevirisi. Kaynak ve değişiklik: MOVENET-NOTICE.md."
          fi
          gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[] | "\(.name) \(.size) \(.url)"'
