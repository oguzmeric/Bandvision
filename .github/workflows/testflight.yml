name: testflight
# Elle tetiklenir: Actions → testflight → Run workflow
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    defaults: { run: { working-directory: apps/ios } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Gizli anahtarları kontrol et
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::$v secret'ı tanımlı değil (Settings → Secrets and variables → Actions)"; exit 1; }
          done

      - name: App Store Connect API anahtarını yaz
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::ASC_KEY_P8 secret'ı tanımlı değil"; exit 1; }
          # Yapıştırma biçiminden bağımsız temiz PEM üret: tarayıcı formları satır sonlarını CRLF yapar,
          # başlıklar eksik ya da her şey tek satır olabilir, dosyanın base64'ü yapıştırılmış olabilir.
          # CryptoKit bunların hepsinde invalidPEMDocument verir.
          raw=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')
          strip() { sed -E 's/-----(BEGIN|END)[A-Z ]*-----//g' | tr -d ' \t\n'; }
          body=$(printf '%s\n' "$raw" | strip)
          case "$body" in
            LS0tLS1*) body=$(printf '%s' "$body" | base64 -D | tr -d '\r' | strip) ;;
          esac
          f="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$f"
          if ! openssl pkey -in "$f" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 geçerli bir özel anahtar değil. .p8 dosyasının tamamını (BEGIN/END satırları dahil) yeniden yapıştır."
            exit 1
          fi
          echo "API anahtarı biçimi geçerli ($(printf '%s' "$body" | wc -c | tr -d ' ') karakter gövde)"

      - name: Kimlik bilgilerini doğrula (değerler yazdırılmaz)
        run: |
          # Yapıştırırken kalan boşluk / satır sonlarını temizle ve sonraki adımlara aktar
          kid=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \t\r\n')
          iss=$(printf '%s' "$ASC_ISSUER_ID" | tr -d ' \t\r\n' | tr 'A-F' 'a-f')
          team=$(printf '%s' "$APPLE_TEAM_ID" | tr -d ' \t\r\n')
          { echo "ASC_KEY_ID_N=$kid"; echo "ASC_ISSUER_ID_N=$iss"; echo "APPLE_TEAM_ID_N=$team"; } >> "$GITHUB_ENV"
          ok=1
          [[ "$kid"  =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID biçimi yanlış (10 karakter, büyük harf/rakam olmalı; ${#kid} karakter)"; ok=0; }
          [[ "$iss"  =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::ASC_ISSUER_ID biçimi yanlış (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx olmalı; ${#iss} karakter)"; ok=0; }
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID biçimi yanlış (10 karakter; ${#team} karakter)"; ok=0; }
          [ "$ok" = 1 ] || exit 1
          echo "Biçimler doğru."

          # Apple API'sine doğrudan dene: 401 ise Key ID / Issuer ID / .p8 birbirine ait değil
          # Homebrew Python sisteme pip kurulumunu engelliyor (PEP 668); geçici sanal ortam kullan
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          ASC_KEY_ID="$kid" ASC_ISSUER_ID="$iss" "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600,
                            "aud": "appstoreconnect-v1"}, key, algorithm="ES256",
                           headers={"kid": os.environ["ASC_KEY_ID"]})
          url = "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.oguzmeric.bantsayac"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::App Store Connect API {e.code} döndü.")
              if e.code == 401:
                  print("::error::Key ID, Issuer ID ve .p8 aynı anahtara ait değil ya da anahtar iptal edilmiş. "
                        "ASC_KEY_ID'nin 'GitHub CI' anahtarının Key ID'si olduğundan emin ol.")
              elif e.code == 403:
                  print("::error::Anahtarın yetkisi yetersiz; 'Admin' erişimiyle oluşturulmalı.")
              sys.exit(1)
          apps = data.get("data", [])
          print(f"API kimlik doğrulaması tamam. Bu bundle ID ile kayıtlı uygulama: {len(apps)}")
          if not apps:
              print("::error::App Store Connect'te com.oguzmeric.bantsayac için uygulama kaydı yok (Apps → + → New App).")
              sys.exit(1)
          PY

      - name: Xcode 26 seç (App Store yüklemesi iOS 26 SDK istiyor)
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$x" ] || x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::Bu sunucuda Xcode 26 yok; runs-on etiketini güncelle"; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Arşivle (Release, otomatik imzalama)
        run: |
          xcodebuild -project BantSayac.xcodeproj -scheme BantSayac \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BantSayac.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID_N" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID_N" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_N" \
            archive -quiet

      - name: Dışa aktar ve TestFlight'a yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID_N</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BantSayac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID_N" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_N"
          echo "Yüklendi: derleme ${{ github.run_number }}. App Store Connect'te işlenmesi 5-15 dk sürer."

      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
